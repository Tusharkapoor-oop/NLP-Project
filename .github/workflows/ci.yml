name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------- lint ----
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

  # ---------------------------------------------------------------- test ----
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install serving dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serve.txt
          pip install httpx

      - name: Run tests
        env:
          PYTHONPATH: src
        # The wrapper gives each run a fresh scratch directory, which keeps
        # the suite green on runners whose system temp is restricted.
        run: python scripts/run_tests.py

  # ---------------------------------------------------- train-and-verify ----
  # Proves the pipeline is reproducible: trains the cheap tiers, evaluates them
  # against the release gate, and boots the API to run the smoke test.
  integration:
    name: Train bronze + verify API
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-serve.txt
          pip install httpx

      - name: Download NLTK data
        run: |
          python -c "import nltk; [nltk.download(p, quiet=True) for p in ['stopwords','punkt_tab','wordnet','omw-1.4']]"

      - name: Train bronze tier
        env:
          PYTHONPATH: src
        run: python -m newsclass.train --tier bronze

      - name: Evaluate against release gate
        env:
          PYTHONPATH: src
        run: python scripts/evaluate.py --tier bronze --sample 500 --gate 0.80

      - name: Accuracy, calibration and probe audit
        # Stricter than the aggregate release gate: per-class scores, expected
        # calibration error and the curated probe set, on a stratified sample.
        # This is the job that fails when the model gets quietly less honest.
        env:
          PYTHONPATH: src
        run: |
          python scripts/accuracy_report.py --tier bronze --sample 500 \
            --min-accuracy 0.80 --min-macro-f1 0.80 --min-probe-accuracy 0.70 \
            --json-out artifacts/accuracy_report.json

      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-report
          path: artifacts/accuracy_report.json
          if-no-files-found: warn

      - name: Boot the API
        env:
          PYTHONPATH: src
          NEWSCLASS_DEFAULT_TIER: bronze
          NEWSCLASS_DOCS_ENABLED: "true"
        run: |
          uvicorn newsclass.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && break
            sleep 2
          done

      - name: Smoke test
        run: python scripts/smoke_test.py --base-url http://127.0.0.1:8000

      - name: Install Playwright browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: UI smoke test (real browser)
        # Boots the same served page, files a story, runs the explanation,
        # records a correction, compares every ready desk and reads the
        # signals panel. Fails on console errors or any HTTP >= 400.
        run: python scripts/ui_smoke.py --base-url http://127.0.0.1:8000 --no-shots

  # --------------------------------------------------------------- docker ----
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      # The gold tier is not committed (250 MB+), so provide a placeholder so
      # the COPY layer in the Dockerfile has something to copy.
      - name: Ensure artifacts dir exists
        run: mkdir -p artifacts && touch artifacts/.keep

      - name: Build image
        run: docker build -f docker/Dockerfile -t newsclass:${{ github.sha }} .

      - name: Verify image starts
        run: |
          docker run -d --name newsclass-test -p 8000:8000 \
            -e NEWSCLASS_DEFAULT_TIER=bronze newsclass:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz; then break; fi
            sleep 2
          done
          docker logs newsclass-test

      - name: Container smoke test
        run: python scripts/smoke_test.py --base-url http://localhost:8000

      - name: Dump logs on failure
        if: failure()
        run: docker logs newsclass-test

      - name: Cleanup
        if: always()
        run: docker rm -f newsclass-test || true

  # ------------------------------------------------------------- security ----
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit serve requirements
        # Non-blocking: third-party advisories should be triaged, not silently
        # break the build. Remove continue-on-error once the backlog is zero.
        continue-on-error: true
        run: pip-audit -r requirements-serve.txt
