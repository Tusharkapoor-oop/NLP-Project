# Bronze/Silver/Gold NLP Project - Config for DistilBERT Fine-tuning

project_name: "AG_News_DistilBERT"
experiment_name: "distilbert_ag_news"
seed: 42

# Data source (trusted Hugging Face dataset)
data:
  dataset_name: "SetFit/ag_news"
  text_column: "text"
  label_column: "label_text"
  label_id_column: "label"
  bronze_dir: "data/bronze"
  silver_dir: "data/silver"
  gold_dir: "data/gold"

# Preprocessing / tokenizer
tokenizer:
  model_name: "distilbert-base-uncased"
  max_length: 128
  padding: "max_length"
  truncation: true
  attn_implementation: "eager"

# Model
model:
  model_name: "distilbert-base-uncased"
  num_labels: 4
  dropout: 0.1
  attention_dropout: 0.1

# Training
training:
  num_epochs: 2
  batch_size: 16
  eval_batch_size: 16
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 50
  eval_strategy: "epoch"
  save_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "f1_macro"
  early_stopping_patience: 1
  gradient_accumulation_steps: 1
  fp16: false

# Logging / MLflow
logging:
  log_dir: "outputs/logs/transformer"
  metrics_dir: "outputs/metrics/transformer"
  figures_dir: "outputs/figures/transformer"
  artifacts_dir: "models/transformer"
  mlflow_tracking_uri: ""

# Evaluation
evaluation:
  report_digits: 4
  top_k: 3
