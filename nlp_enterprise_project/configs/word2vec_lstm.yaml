# Bronze/Silver/Gold NLP Project - Config for Word2Vec + BiLSTM

project_name: "BBC_News_Word2Vec_BiLSTM"
experiment_name: "word2vec_lstm_bbc"
seed: 42

# Data source (trusted Hugging Face dataset)
data:
  dataset_name: "SetFit/bbc-news"
  text_column: "text"
  label_column: "label_text"
  bronze_dir: "data/bronze"
  silver_dir: "data/silver"
  gold_dir: "data/gold"

# Preprocessing
preprocessing:
  max_num_words: 8000
  max_seq_len: 120
  embedding_dim: 100
  min_word_count: 2
  stopwords_source: "nltk"

# Word2Vec
word2vec:
  vector_size: 100
  window: 5
  min_count: 2
  sg: 1
  workers: 4
  epochs: 30

# Model architecture
model:
  hidden_dim: 64
  num_layers: 2
  dropout: 0.5
  bidirectional: true
  activation: "softmax"

# Training
training:
  epochs: 25
  batch_size: 32
  learning_rate: 0.002
  patience: 5
  min_lr: 0.000001
  weight_decay: 0.0

# Logging / MLflow
logging:
  log_dir: "outputs/logs/word2vec_lstm"
  metrics_dir: "outputs/metrics/word2vec_lstm"
  figures_dir: "outputs/figures/word2vec_lstm"
  artifacts_dir: "models/word2vec_lstm"
  mlflow_tracking_uri: ""

# Evaluation
evaluation:
  report_digits: 4
  top_k: 3
